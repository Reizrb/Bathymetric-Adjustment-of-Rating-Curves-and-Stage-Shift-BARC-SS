[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "barcss"
version = "1.0.0"
description = "BARC and BARC-SS: bathymetric adjustment of OWP HAND-FIM synthetic rating curves using ML-predicted channel geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Reihaneh Zarrabi"}]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "matplotlib>=3.6",
  "rasterio>=1.3",
  "geopandas>=0.12",
  "hydrogeomkit @ git+https://github.com/Reizrb/HydroGeom",
]

[project.optional-dependencies]
example = ["fimserve>=0.2.13", "jupyter"]
test = ["pytest"]

[project.urls]
Source = "https://github.com/Reizrb/Bathymetric-Adjustment-of-Rating-Curves-and-Stage-Shift-BARC-SS"
"Channel geometry" = "https://github.com/Reizrb/HydroGeom"
FIMserv = "https://github.com/sdmlua/FIMserv"

[tool.setuptools]
packages = ["barcss"]
